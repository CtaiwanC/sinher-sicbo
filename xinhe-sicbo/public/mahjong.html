<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鑫河麻將</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06140e;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#f4ecd6}
#stage{position:absolute;left:50%;top:50%;width:1000px;height:700px;transform-origin:center;border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#2f8a52 0%,#1d6a3c 55%,#0f4024 100%);box-shadow:inset 0 0 0 10px #5a3518,inset 0 0 0 14px #2c1708,inset 0 0 80px rgba(0,0,0,.55)}
#stage::before{content:"鑫河麻將";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font:900 120px/1 "Noto Serif TC",serif;color:rgba(0,0,0,.08);letter-spacing:.1em;pointer-events:none;white-space:nowrap}
.abs{position:absolute}
#back{left:22px;top:18px;z-index:5;color:#f3d27a;text-decoration:none;font:700 15px/1 sans-serif;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:8px}
/* 牌 */
.tl{position:relative;width:var(--w);height:var(--h);flex:none;border-radius:calc(var(--w)*.12);
  background:linear-gradient(180deg,#fffef8 0%,#f3ecd6 78%,#e5d9b8 100%);
  box-shadow:0 calc(var(--w)*.14) 0 #2e8a55,0 calc(var(--w)*.14 + 2px) 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08)}
.tl svg{position:absolute;inset:6% 7%;width:86%;height:88%}
.tl.bk{background:linear-gradient(180deg,#43b06f,#258a4e 70%,#1a6a3b);box-shadow:0 calc(var(--w)*.14) 0 #f3ecd6,0 calc(var(--w)*.14 + 2px) 3px rgba(0,0,0,.45)}
.big{--w:50px;--h:70px}.mid{--w:34px;--h:47px}.sm{--w:28px;--h:38px}.xs{--w:26px;--h:35px}
.tl.last{outline:3px solid #ffd54f;outline-offset:1px}
.tl.win{outline:3px solid #ff5252;outline-offset:1px}
.side{width:30px;height:15px;flex:none;border-radius:3px;background:linear-gradient(90deg,#f3ecd6 0 30%,#3aa565 30% 100%);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.side.r{background:linear-gradient(270deg,#f3ecd6 0 30%,#3aa565 30% 100%)}
.row{display:flex;gap:2px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:2px}
.meld{display:flex;gap:1px;margin-right:8px}
/* 座位 */
.tag{font-size:13px;background:rgba(0,0,0,.45);border:1px solid rgba(243,210,122,.45);border-radius:8px;padding:3px 9px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tag.on{border-color:#ffd54f;box-shadow:0 0 12px #ffd54f}
.tag b{background:#c62828;color:#fff;border-radius:4px;padding:0 4px;font-size:11px}
.tag .w{color:#ffd54f;font-weight:700}
.tag .sc{color:#9fe0b4;font-variant-numeric:tabular-nums}
#t2{left:50%;top:22px;transform:translateX(-50%)}
#h2{left:50%;top:52px;transform:translateX(-50%)}
#m2{right:740px;top:52px;flex-direction:row-reverse}
#t3{left:22px;top:76px}#h3{left:30px;top:120px}#m3{left:150px;top:350px;transform:translate(-50%,-50%) rotate(90deg)}
#t1{right:22px;top:76px}#h1{right:30px;top:120px}#m1{left:850px;top:350px;transform:translate(-50%,-50%) rotate(-90deg)}
#t0{left:30px;top:520px}#m0{left:30px;top:548px}
#hand{left:50%;top:604px;transform:translateX(-50%)}
#hand .tl{cursor:pointer;transition:transform .08s}
#hand.can .tl:hover{transform:translateY(-10px)}
#hand .tl.new{margin-left:16px}
/* 打出的牌 */
.pool{width:240px;height:120px;display:flex;flex-wrap:wrap;gap:6px 2px;align-content:flex-start}
.pool .tl{--w:24px;--h:32px}
.pool.dense{gap:4px 2px}.pool.dense .tl{--w:19px;--h:26px}
.pool.denser{gap:3px 1px}.pool.denser .tl{--w:16px;--h:22px}
/* 四家打出的牌圍成風車形，彼此不重疊 */
#d0{left:440px;top:360px}
#d1{left:500px;top:180px;transform:rotate(-90deg)}
#d2{left:320px;top:120px;transform:rotate(180deg)}
#d3{left:260px;top:300px;transform:rotate(90deg)}
/* 中央 */
#center{left:442px;top:242px;width:116px;height:116px;border-radius:12px;background:rgba(0,0,0,.55);border:2px solid #b38a3c;display:grid;grid-template:1fr 1.3fr 1fr/1fr 1.3fr 1fr;place-items:center;font:900 20px/1 "Noto Serif TC",serif}
#center .me{color:#ffd54f}
#center .mid{grid-area:2/2;font:600 12px/1.35 sans-serif;text-align:center;color:#cfe9d9}
#cw0{grid-area:3/2}#cw1{grid-area:2/3}#cw2{grid-area:1/2}#cw3{grid-area:2/1}
#msg{left:50%;top:494px;transform:translateX(-50%);font-size:14px;color:#ffe08a;text-shadow:0 1px 2px #000;white-space:nowrap}
/* 動作列 */
#acts{left:50%;top:515px;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:linear-gradient(#2a2a2a,#0d0d0d);border:2px solid #6b5a2c;border-radius:10px;padding:6px 10px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#acts.show{display:flex}
#acts .cd{font:900 34px/1 "Noto Serif TC",serif;color:#ffcf3f;width:52px;text-align:center}
#acts button{width:58px;height:58px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);border:0;background:linear-gradient(#5a5a5a,#2b2b2b);color:#8a8a8a;font:900 24px/1 "Noto Serif TC",serif;cursor:default}
#acts button.on{background:linear-gradient(#fff6d0,#e2c46a);color:#1a1a1a;cursor:pointer}
#acts button.hu{clip-path:circle(48%);}
#acts button.hu.on{background:radial-gradient(#ff6b6b,#b71c1c);color:#fff}
#acts button.x{width:auto;clip-path:none;border-radius:8px;padding:0 14px;height:42px;font-size:17px}
#acts button.x.on{background:linear-gradient(#e0e0e0,#9e9e9e)}
#acts .opt{display:flex;gap:2px;padding:4px;border-radius:6px;cursor:pointer;background:#3a3a3a}
#acts .opt:hover{background:#6b5a2c}
#ting{right:30px;top:500px;display:none;align-items:center;gap:4px;background:rgba(0,0,0,.5);border:1px solid #c62828;border-radius:8px;padding:4px 8px;font-size:13px;color:#ffd54f}
#ting.show{display:flex}
.tl.tp::after{content:"聽";position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:#c62828;color:#fff;font:700 12px/16px sans-serif;border-radius:4px;padding:0 4px}
#info{right:22px;top:18px;font-size:12px;color:#cfe9d9;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:8px;text-align:right;line-height:1.5}
/* 結算 */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:9}
#modal .box{background:linear-gradient(#173f2b,#0d2a1c);border:2px solid #d4a94a;border-radius:14px;padding:18px 22px;width:640px;display:grid;gap:10px}
#modal h2{margin:0;color:#ffd54f;text-align:center;font:900 28px/1.2 "Noto Serif TC",serif}
#modal .tais{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 16px;font-size:15px}
#modal .btns{display:flex;gap:10px;justify-content:center}
#modal button{background:#c62828;color:#fff;border:0;border-radius:8px;padding:9px 22px;font-size:16px;font-weight:700;cursor:pointer}
#modal button.g{background:#455a64}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block;position:fixed;top:6px;left:0;right:0;text-align:center;font-size:12px;color:#ffd54f;z-index:20}}
</style></head><body>
<div id="rot">橫放手機可以看得更清楚</div>
<div id="stage">
  <a id="back" class="abs" href="/">‹ 大廳</a>
  <div id="t2" class="abs tag"></div><div id="h2" class="abs row"></div><div id="m2" class="abs row"></div>
  <div id="t3" class="abs tag"></div><div id="h3" class="abs col"></div><div id="m3" class="abs row"></div>
  <div id="t1" class="abs tag"></div><div id="h1" class="abs col"></div><div id="m1" class="abs row"></div>
  <div id="d2" class="abs pool"></div><div id="d3" class="abs pool"></div><div id="d1" class="abs pool"></div><div id="d0" class="abs pool"></div>
  <div id="center" class="abs"><span id="cw2"></span><span id="cw3"></span><div class="mid" id="cmid"></div><span id="cw1"></span><span id="cw0"></span></div>
  <div id="msg" class="abs"></div>
  <div id="acts" class="abs"></div>
  <div id="t0" class="abs tag"></div><div id="m0" class="abs row"></div>
  <div id="hand" class="abs row"></div>
  <div id="ting" class="abs"></div><div id="info" class="abs"></div>
  <div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
// 台灣十六張麻將：你 + 3 位電腦。逆時針順序 你(下)→下家(右)→對家(上)→上家(左)
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NUM=["一","二","三","四","五","六","七","八","九"],NUMW=["一","二","三","四","伍","六","七","八","九"],SU=["萬","筒","條"],ZI=["東","南","西","北","中","發","白"],FL=["春","夏","秋","冬","梅","蘭","竹","菊"],WIND=["東","南","西","北"];
const NAMES=["你","阿龍","小美","老K"], POS=["自己","下家","對家","上家"];
const BASE=300, PER=100, KEEP=16, THINK=15;
const tname=t=>t<27?NUM[t%9]+SU[t/9|0]:t<34?ZI[t-27]:FL[t-34];

// ---------- 牌面圖案（SVG）----------
const CB="#1f5fb0",CG="#178a47",CR="#c62828",CK="#18264a",SERIF="'Noto Serif TC','Songti TC','PMingLiU',serif";
const tx=(c,x,y,s,col)=>`<text x="${x}" y="${y}" font-size="${s}" fill="${col}" text-anchor="middle" font-family="${SERIF}" font-weight="900">${c}</text>`;
const ring=(x,y,r,col)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><circle cx="${x}" cy="${y}" r="${r*.74}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r*.52}" fill="${col}"/><circle cx="${x}" cy="${y}" r="${r*.2}" fill="#fff"/>`;
const stick=(x,y,h,col)=>`<rect x="${x-3.6}" y="${y-h/2}" width="7.2" height="${h}" rx="3.2" fill="${col}"/><rect x="${x-4.4}" y="${y-1.2}" width="8.8" height="2.4" rx="1" fill="${col}"/><line x1="${x}" y1="${y-h/2+2.5}" x2="${x}" y2="${y+h/2-2.5}" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>`;
function dots(n){
  const L={2:[[30,21,CG],[30,59,CB]],3:[[14,15,CB],[30,40,CR],[46,65,CG]],4:[[16,21,CB],[44,21,CG],[16,59,CG],[44,59,CB]],
    5:[[15,17,CB],[45,17,CG],[30,40,CR],[15,63,CG],[45,63,CB]],6:[[17,14,CG],[43,14,CG],[17,44,CR],[43,44,CR],[17,67,CR],[43,67,CR]],
    7:[[12,11,CG],[30,21,CG],[48,31,CG],[17,51,CR],[43,51,CR],[17,69,CR],[43,69,CR]],
    8:[[17,11,CB],[43,11,CB],[17,30,CB],[43,30,CB],[17,50,CB],[43,50,CB],[17,69,CB],[43,69,CB]],
    9:[[12,14,CB],[30,14,CB],[48,14,CB],[12,40,CR],[30,40,CR],[48,40,CR],[12,66,CG],[30,66,CG],[48,66,CG]]};
  const R={2:13,3:11,4:12,5:10.5,6:9.5,7:8.5,8:8.5,9:8.5};
  if(n===1)return ring(30,40,26,CG)+`<circle cx="30" cy="40" r="11" fill="${CR}"/><circle cx="30" cy="40" r="5" fill="#fff"/>`+[0,45,90,135,180,225,270,315].map(a=>`<circle cx="${30+16.5*Math.cos(a*Math.PI/180)}" cy="${40+16.5*Math.sin(a*Math.PI/180)}" r="2.3" fill="${CB}"/>`).join("");
  return L[n].map(([x,y,c])=>ring(x,y,R[n],c)).join("");
}
function bams(n){
  if(n===1)return `<path d="M30 18c-8 0-12 7-11 14 1 8 6 14 11 18 5-4 10-10 11-18 1-7-3-14-11-14z" fill="${CG}"/><circle cx="30" cy="16" r="6" fill="${CR}"/><path d="M33 15l7-2-6 5z" fill="#e0a020"/><circle cx="31.5" cy="15" r="1.4" fill="#fff"/><path d="M22 48l-8 20M30 50v22M38 48l8 20" stroke="${CB}" stroke-width="3.5" stroke-linecap="round"/><path d="M24 30c3 4 9 4 12 0" stroke="#fff" stroke-width="1.6" fill="none"/>`;
  const H=n>=7?19:24,L={2:[[30,21],[30,59]],3:[[30,21],[17,59],[43,59]],4:[[17,21],[43,21],[17,59],[43,59]],5:[[13,21],[47,21],[30,40,1],[13,59],[47,59]],
    6:[[13,21],[30,21],[47,21],[13,59],[30,59],[47,59]],7:[[30,12,1],[13,40],[30,40],[47,40],[13,67],[30,67],[47,67]],
    8:null,9:[[13,13],[30,13,1],[47,13],[13,40],[30,40,1],[47,40],[13,67],[30,67,1],[47,67]]};
  if(n===8){const g=(x,y,a)=>`<g transform="rotate(${a} ${x} ${y})">${stick(x,y,24,CG)}</g>`;return g(9,21,0)+g(23,21,28)+g(37,21,-28)+g(51,21,0)+g(9,59,0)+g(23,59,-28)+g(37,59,28)+g(51,59,0)}
  return L[n].map(([x,y,r])=>stick(x,y,H,r?CR:CG)).join("");
}
const FACE={};
function face(t){
  if(FACE[t])return FACE[t];let s;
  if(t<9)s=tx(NUMW[t],30,32,27,CK)+tx("萬",30,71,32,CR);
  else if(t<18)s=dots(t-8);else if(t<27)s=bams(t-17);
  else if(t<31)s=tx(ZI[t-27],30,55,44,CK);
  else if(t===31)s=tx("中",30,56,46,CR);
  else if(t===32)s=tx("發",30,56,46,CG);
  else if(t===33)s=`<rect x="11" y="12" width="38" height="56" rx="4" fill="none" stroke="${CB}" stroke-width="4.5"/><rect x="17.5" y="18.5" width="25" height="43" rx="2" fill="none" stroke="${CB}" stroke-width="1.6"/>`;
  else{const k=t-34,col=k<4?CR:CG;s=`<text x="9" y="14" font-size="12" fill="${CB}" font-family="sans-serif" font-weight="700">${k%4+1}</text>`+
    [0,72,144,216,288].map(a=>`<ellipse cx="${46+5*Math.cos(a*Math.PI/180)}" cy="${16+5*Math.sin(a*Math.PI/180)}" rx="3.2" ry="3.2" fill="#e57373"/>`).join("")+`<circle cx="46" cy="16" r="2.4" fill="#ffca28"/>`+tx(FL[k],30,60,36,col)}
  return FACE[t]=`<svg viewBox="0 0 60 80">${s}</svg>`;
}
const tile=(t,cls="")=>t===99?`<div class="tl bk ${cls}"></div>`:`<div class="tl ${cls}" data-t="${t}">${face(t)}</div>`;

// ---------- 胡牌判斷 ----------
const counts=a=>{const c=Array(34).fill(0);a.forEach(t=>c[t]++);return c};
function sets(c,mode){const i=c.findIndex(x=>x>0);if(i<0)return true;
  if(mode!=="c"&&c[i]>=3){c[i]-=3;const ok=sets(c,mode);c[i]+=3;if(ok)return true}
  if(mode!=="p"&&i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const ok=sets(c,mode);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true}
  return false}
function decomp(c,mode){if(c.reduce((a,b)=>a+b,0)%3!==2)return false;for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;const ok=sets(c,mode);c[i]+=2;if(ok)return true}return false}
const isWin=c=>decomp(c);

let scores=[0,0,0,0];try{const s=JSON.parse(localStorage.getItem("xh-mj-scores"));if(Array.isArray(s)&&s.length===4)scores=s}catch{}
const save=()=>{try{localStorage.setItem("xh-mj-scores",JSON.stringify(scores))}catch{}};
let P=[],wall=[],dealer=0,roundWind=0,passes=0,turn=-1,last=null,resolver=null,myTurn=null,cdTimer=null,showTing=false;
const seatWind=i=>(i-dealer+4)%4;
const msg=t=>$("msg").textContent=t;

function newWall(){const w=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)w.push(t);for(let f=34;f<42;f++)w.push(f);
  for(let i=w.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[w[i],w[j]]=[w[j],w[i]]}return w}
function draw(p,tail){let t=tail?wall.pop():wall.shift();while(t>=34){p.flowers.push(t);msg(p.name+" 補花 "+tname(t));t=wall.pop()}p.hand.push(t);return t}
function removeN(arr,t,n){for(let k=0;k<n;k++)arr.splice(arr.indexOf(t),1)}

// ---------- 畫面 ----------
function fit(){const s=Math.min(innerWidth/1000,innerHeight/700);$("stage").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();
const meldHTML=(m,cls)=>`<div class="meld">${m.t.map((x,k)=>tile(m.k==="ankong"&&k!==1&&k!==2?99:x,cls)).join("")}</div>`;
function tag(i){const p=P[i];return `<span class="w">${WIND[seatWind(i)]}</span>${i?POS[i]+"・":""}${p.name}${i===dealer?"<b>莊</b>":""}<span class="sc">${scores[i]>=0?"+":""}${scores[i].toLocaleString()}</span>`}
function waits(hand){const c=counts(hand),r=[];for(let t=0;t<34;t++)if(c[t]<4){c[t]++;if(isWin(c))r.push(t);c[t]--}return r}
function seen(t){let n=P[0].hand.filter(x=>x===t).length;P.forEach((p,i)=>{n+=p.discards.filter(x=>x===t).length;p.melds.forEach(m=>{if(i===0||m.k!=="ankong")n+=m.t.filter(x=>x===t).length})});return n}
function tingHTML(w){return `聽 ${w.map(t=>tile(t,"xs")).join("")} 剩 ${w.reduce((a,t)=>a+Math.max(0,4-seen(t)),0)} 張`}
function tingCandidates(){const h=P[0].hand,o={};if(h.length%3!==2)return o;for(const t of new Set(h)){const x=h.slice();x.splice(x.indexOf(t),1);const w=waits(x);if(w.length)o[t]=w}return o}
function render(){
  for(let i=0;i<4;i++){const el=$("t"+i);el.innerHTML=tag(i);el.classList.toggle("on",turn===i);
    $("cw"+i).textContent=WIND[seatWind(i)];$("cw"+i).className=i===0?"me":"";
    const p=P[i],mine=p.flowers.map(f=>tile(f,i?"sm":"mid")).join("")+p.melds.map(m=>meldHTML(m,i?"sm":"mid")).join("");
    $("m"+i).innerHTML=mine;
    const n=p.discards.length;$("d"+i).classList.toggle("dense",n>27&&n<=44);$("d"+i).classList.toggle("denser",n>44);
    $("d"+i).innerHTML=p.discards.map((t,k)=>tile(t,"xs"+(last&&last.p===i&&k===p.discards.length-1?" last":""))).join("")}
  $("h2").innerHTML=P[2].hand.map(()=>tile(99,"xs")).join("");
  $("h3").innerHTML=P[3].hand.map(()=>`<div class="side"></div>`).join("");
  $("h1").innerHTML=P[1].hand.map(()=>`<div class="side r"></div>`).join("");
  $("cmid").innerHTML=`${WIND[roundWind]}風圈<br>剩 ${Math.max(0,wall.length-KEEP)} 張`;
  $("info").innerHTML=`底 ${BASE}・台 ${PER}<br>莊家：${P[dealer].name}`;
  const me=P[0];let h=me.hand.slice(),nw=null;
  if(myTurn&&myTurn.drawn!=null){h.splice(h.indexOf(myTurn.drawn),1);nw=myTurn.drawn}
  h.sort((a,b)=>a-b);$("hand").className="abs row"+(myTurn?" can":"");
  const cand=myTurn&&showTing?tingCandidates():{};
  $("hand").innerHTML=h.map(t=>tile(t,"big"+(cand[t]?" tp":""))).join("")+(nw!=null?tile(nw,"big new"+(cand[nw]?" tp":"")):"");
  const tg=$("ting");let w=[];if(me.hand.length%3===1)w=waits(me.hand);
  if(w.length){tg.innerHTML=tingHTML(w);tg.classList.add("show")}else tg.classList.remove("show");
}
$("hand").addEventListener("mouseover",e=>{const el=e.target.closest(".tl.tp");if(!el)return;const w=tingCandidates()[+el.dataset.t];if(w){$("ting").innerHTML="打這張"+tingHTML(w);$("ting").classList.add("show")}});
$("hand").addEventListener("click",e=>{const el=e.target.closest(".tl");if(!el||!myTurn)return;done({type:"discard",tile:+el.dataset.t})});
// 動作列：吃 碰 槓 胡 取消 + 倒數
function bar(avail,onTimeout,showCancel){
  clearInterval(cdTimer);const a=$("acts");a.innerHTML="";a.classList.add("show");
  const cd=document.createElement("span");cd.className="cd";let n=THINK;cd.textContent=String(n).padStart(2,"0");a.append(cd);
  for(const [lb,key] of [["吃","chi"],["碰","pong"],["槓","kong"],["聽","ting"],["胡","win"]]){
    const b=document.createElement("button");b.textContent=lb;if(key==="win")b.classList.add("hu");
    if(avail[key]){b.classList.add("on");b.onclick=avail[key]}a.append(b)}
  if(showCancel){const b=document.createElement("button");b.className="x on";b.textContent="取消";b.onclick=()=>done(null);a.append(b)}
  cdTimer=setInterval(()=>{n--;cd.textContent=String(Math.max(0,n)).padStart(2,"0");if(n<=0){clearInterval(cdTimer);onTimeout()}},1000);
}
function chooseBar(list){const a=$("acts");a.querySelectorAll("button").forEach(b=>b.remove());
  list.forEach(o=>{const d=document.createElement("div");d.className="opt";d.innerHTML=o.tiles.map(t=>tile(t,"sm")).join("");d.onclick=()=>done(o.v);a.append(d)});
  const b=document.createElement("button");b.className="x on";b.textContent="取消";b.onclick=()=>done(null);a.append(b)}
function done(v){clearInterval(cdTimer);showTing=false;$("acts").classList.remove("show");const r=resolver;resolver=null;myTurn=null;render();if(r)r(v)}

// ---------- 電腦 ----------
function botDiscard(i){const p=P[i],c=counts(p.hand);let best=p.hand[0],bv=1e9;
  for(const t of new Set(p.hand)){let v=c[t]*4;
    if(t<27){const n=t%9,g=d=>(n+d>=0&&n+d<=8)?c[t+d]:0;v+=(g(-1)+g(1))*3+(g(-2)+g(2))*1.5;if(n===0||n===8)v-=.6}
    else if(t>=31||t-27===roundWind||t-27===seatWind(i))v+=.8;
    v+=Math.random()*.3;if(v<bv){bv=v;best=t}}
  return best}
function botClaim(i,t,opts){
  const w=opts.find(o=>o.type==="win");if(w)return w;
  const k=opts.find(o=>o.type==="kong");if(k&&Math.random()<.6)return k;
  const p=opts.find(o=>o.type==="pong");if(p&&(t>=27||Math.random()<.45))return p;
  const ch=opts.filter(o=>o.type==="chi");if(ch.length&&Math.random()<.3)return ch[0];
  return null}

// ---------- 自己回合（摸牌後）----------
async function selfTurn(i,drawn,didDraw,kongDraw){
  const p=P[i],c=counts(p.hand),canZimo=didDraw&&isWin(c),kongs=[];
  if(didDraw&&wall.length>KEEP){for(let t=0;t<34;t++)if(c[t]===4)kongs.push({t,an:true});
    p.melds.forEach(m=>{if(m.k==="pong"&&c[m.t[0]])kongs.push({t:m.t[0],add:true})})}
  let r;
  if(p.bot){await sleep(650);
    if(canZimo)r={type:"win"};else if(kongs.length&&Math.random()<.8)r={type:"kong",...kongs[0]};else r={type:"discard",tile:botDiscard(i)}}
  else if(didDraw&&drawn!=null&&!canZimo&&!kongs.length&&(()=>{const x=p.hand.slice();x.splice(x.indexOf(drawn),1);return waits(x).length>0})()){
    // 已經聽牌：摸到不能胡的牌就自動打出
    myTurn={drawn};render();myTurn=null;msg("聽牌中，摸到 "+tname(drawn)+" 自動打出");await sleep(900);r={type:"discard",tile:drawn}}
  else{msg(canZimo?"可以自摸！":"輪到你，點一張牌打出");
    while(!r)r=await new Promise(res=>{resolver=res;myTurn={drawn:didDraw?drawn:null};render();
      const av={};if(canZimo)av.win=()=>done({type:"win"});
      if(kongs.length)av.kong=()=>kongs.length===1?done({type:"kong",...kongs[0]}):chooseBar(kongs.map(k=>({tiles:[k.t,k.t,k.t,k.t],v:{type:"kong",...k}})));
      if(Object.keys(tingCandidates()).length)av.ting=()=>{showTing=!showTing;render();msg(showTing?"標「聽」的牌打出去就聽牌，滑過去可看聽哪幾張":"輪到你，點一張牌打出")};
      const auto=didDraw&&drawn!=null?drawn:p.hand.slice().sort((a,b)=>a-b).pop();
      bar(av,()=>done(canZimo?{type:"win"}:{type:"discard",tile:auto}),false)})}
  if(r.type==="kong"){if(r.an){removeN(p.hand,r.t,4);p.melds.push({k:"ankong",t:[r.t,r.t,r.t,r.t]});msg(p.name+" 暗槓")}
    else{removeN(p.hand,r.t,1);const m=p.melds.find(m=>m.k==="pong"&&m.t[0]===r.t);m.k="kong";m.t.push(r.t);msg(p.name+" 加槓 "+tname(r.t))}}
  r.kongDraw=kongDraw;return r}

// ---------- 別人打牌後：胡 > 碰/槓 > 吃 ----------
async function claims(from,t){
  const dec=[];
  for(let k=1;k<4;k++){const i=(from+k)%4,c=counts(P[i].hand),o=[];
    c[t]++;if(isWin(c))o.push({type:"win"});c[t]--;
    if(wall.length>KEEP){if(c[t]>=2)o.push({type:"pong"});if(c[t]===3)o.push({type:"kong"});
      if(k===1&&t<27){const n=t%9;[[-2,-1],[-1,1],[1,2]].forEach(([a,b])=>{if(n+a>=0&&n+b<=8&&c[t+a]&&c[t+b])o.push({type:"chi",use:[t+a,t+b]})})}}
    if(!o.length)continue;
    let d;
    if(P[i].bot)d=botClaim(i,t,o);
    else{msg(`${P[from].name} 打出 ${tname(t)}`);
      d=await new Promise(res=>{resolver=res;const av={};
        for(const ty of ["win","pong","kong"]){const x=o.find(z=>z.type===ty);if(x)av[ty]=()=>done(x)}
        const ch=o.filter(z=>z.type==="chi");
        if(ch.length)av.chi=()=>ch.length===1?done(ch[0]):chooseBar(ch.map(x=>({tiles:[x.use[0],t,x.use[1]].sort((a,b)=>a-b),v:x})));
        bar(av,()=>done(null),true)})}
    if(d)dec.push({...d,p:i,order:k})}
  const pr={win:3,kong:2,pong:2,chi:1};
  dec.sort((a,b)=>pr[b.type]-pr[a.type]||a.order-b.order);
  return dec[0]||null}

// ---------- 一局 ----------
async function playHand(){
  wall=newWall();last=null;
  P=NAMES.map((n,i)=>({name:n,bot:i>0,hand:[],melds:[],flowers:[],discards:[]}));
  for(let r=0;r<16;r++)for(let k=0;k<4;k++)P[(dealer+k)%4].hand.push(wall.shift());
  for(let k=0;k<4;k++){const p=P[(dealer+k)%4];let j;while((j=p.hand.findIndex(t=>t>=34))>=0){p.flowers.push(p.hand.splice(j,1)[0]);p.hand.push(wall.pop())}}
  let cur=dealer,mode="draw",kongDraw=false;
  while(true){
    turn=cur;let drawn=null;
    if(mode==="draw"){if(wall.length<=KEEP)return finish(null);drawn=draw(P[cur],kongDraw)}
    render();
    const r=await selfTurn(cur,drawn,mode==="draw",kongDraw);kongDraw=false;
    if(r.type==="win")return finish({w:cur,from:-1,t:drawn,kongDraw:r.kongDraw});
    if(r.type==="kong"){mode="draw";kongDraw=true;continue}
    const t=r.tile,p=P[cur];removeN(p.hand,t,1);p.discards.push(t);last={p:cur,t};msg(`${p.name} 打出 ${tname(t)}`);render();
    await sleep(p.bot?450:200);
    const c=await claims(cur,t);
    if(c){
      if(c.type==="win"){p.discards.pop();last=null;return finish({w:c.p,from:cur,t})}
      p.discards.pop();last=null;const q=P[c.p];
      if(c.type==="pong"){removeN(q.hand,t,2);q.melds.push({k:"pong",t:[t,t,t]});msg(q.name+" 碰 "+tname(t));mode="claim"}
      else if(c.type==="kong"){removeN(q.hand,t,3);q.melds.push({k:"kong",t:[t,t,t,t]});msg(q.name+" 槓 "+tname(t));mode="draw";kongDraw=true}
      else{removeN(q.hand,c.use[0],1);removeN(q.hand,c.use[1],1);q.melds.push({k:"chi",t:[c.use[0],t,c.use[1]].sort((a,b)=>a-b)});msg(q.name+" 吃 "+tname(t));mode="claim"}
      cur=c.p;render();await sleep(400);continue}
    cur=(cur+1)%4;mode="draw"}
}

// ---------- 算台 ----------
function scoreHand(i,t,zimo,kongDraw){
  const p=P[i],full=p.hand.slice();if(!zimo)full.push(t);
  const c=counts(full),L=[],add=(n,v)=>L.push([n,v]);
  const open=p.melds.filter(m=>m.k!=="ankong"),menq=!open.length,sw=seatWind(i);
  if(i===dealer)add("莊家",1);
  if(menq&&zimo)add("門清自摸",3);else{if(menq)add("門清",1);if(zimo)add("自摸",1)}
  const fs=p.flowers;
  if([34,35,36,37].every(f=>fs.includes(f)))add("春夏秋冬",2);else if(fs.includes(34+sw))add("正花 "+FL[sw],1);
  if([38,39,40,41].every(f=>fs.includes(f)))add("梅蘭竹菊",2);else if(fs.includes(38+sw))add("正花 "+FL[4+sw],1);
  const mp=Array(34).fill(false);p.melds.forEach(m=>{if(m.k!=="chi")mp[m.t[0]]=true});
  const pung=h=>mp[h]||c[h]>=3,pair=h=>c[h]===2;
  const dr=[31,32,33].filter(pung).length;
  if(dr===3)add("大三元",8);else if(dr===2&&[31,32,33].some(pair))add("小三元",4);else [31,32,33].forEach(h=>{if(pung(h))add(ZI[h-27]+"刻",1)});
  const wd=[27,28,29,30].filter(pung).length;
  if(wd===4)add("大四喜",16);else if(wd===3&&[27,28,29,30].some(pair))add("小四喜",8);
  else{if(pung(27+roundWind))add("圈風 "+WIND[roundWind],1);if(pung(27+sw))add("門風 "+WIND[sw],1)}
  const all=full.concat(...p.melds.map(m=>m.t)),suits=new Set(all.filter(x=>x<27).map(x=>x/9|0)),hasZ=all.some(x=>x>=27);
  if(!suits.size)add("字一色",16);else if(suits.size===1)hasZ?add("混一色",4):add("清一色",8);
  if(p.melds.every(m=>m.k!=="chi")&&decomp(c.slice(),"p"))add("碰碰胡",4);
  if(!zimo&&!fs.length&&!hasZ&&p.melds.every(m=>m.k==="chi")&&decomp(c.slice(),"c"))add("平胡",2);
  if(!zimo&&open.length===5)add("全求人",2);
  if(kongDraw)add("槓上開花",1);
  if(wall.length<=KEEP)add(zimo?"海底撈月":"河底撈魚",1);
  return L}

function finish(res){
  turn=-1;myTurn=null;clearInterval(cdTimer);$("acts").classList.remove("show");render();
  let html;
  if(!res){html=`<h2>流局</h2><p style="text-align:center;margin:0">牌摸完了，莊家連莊。</p>`;}
  else{const{w,from,t,kongDraw}=res,zimo=from<0,L=scoreHand(w,t,zimo,kongDraw),tai=L.reduce((a,x)=>a+x[1],0),pay=[];
    const payers=zimo?[1,2,3].map(k=>(w+k)%4):[from];
    payers.forEach(j=>{const extra=(j===dealer&&w!==dealer)?1:0,amt=BASE+PER*(tai+extra);scores[j]-=amt;scores[w]+=amt;pay.push(`${P[j].name} 付 ${amt.toLocaleString()}${extra?"（含莊家 1 台）":""}`)});
    save();const p=P[w],hand=p.hand.slice();if(zimo)hand.splice(hand.indexOf(t),1);hand.sort((a,b)=>a-b);
    html=`<h2>${p.name} ${zimo?"自摸":"胡牌"}！ ${tai} 台</h2>
      <div class="row" style="flex-wrap:wrap;justify-content:center">${p.flowers.map(f=>tile(f,"sm")).join("")}${p.melds.map(m=>meldHTML(m,"sm")).join("")}</div>
      <div class="row" style="justify-content:center;margin-bottom:6px">${hand.map(x=>tile(x,"mid")).join("")}<span style="width:10px"></span>${tile(t,"mid win")}</div>
      ${zimo?"":`<p style="margin:0;text-align:center">${P[from].name} 放槍 ${tname(t)}</p>`}
      <div class="tais">${L.map(([n,v])=>`<span>${n}　<b style="color:#ffd54f">${v} 台</b></span>`).join("")}</div>
      <p style="margin:0;font-size:14px;color:#cfe9d9">底 ${BASE}・每台 ${PER}：${pay.join("，")}</p>`;
    if(w!==dealer){dealer=(dealer+1)%4;passes++;if(passes%4===0)roundWind=(roundWind+1)%4}}
  $("mbox").innerHTML=html+`<div class="btns"><button id="next">下一局</button><button class="g" id="reset">分數歸零</button></div>`;
  $("modal").style.display="grid";
  $("next").onclick=()=>{$("modal").style.display="none";playHand()};
  $("reset").onclick=()=>{scores=[0,0,0,0];save();$("modal").style.display="none";playHand()};
}
playHand();
</script></body></html>
