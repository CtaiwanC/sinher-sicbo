<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鑫河大廳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;600&display=swap">
<style>
/* Layout: casino lobby — gold title over a row of game cabinets. Single dark look by choice. */
:root{--bg:#140405;--card:#2a0508;--neon:#ff2b3e;--gold:#e6bb62;--ivory:#f6ecd8;--muted:#c9a8a4;--felt:#14563f;
  --display:"Noto Serif TC",serif;--body:"Noto Sans TC",system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a0d10,var(--bg) 65%) fixed,var(--bg);color:var(--ivory);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:28px}
header{text-align:center;display:grid;gap:6px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,6vw,3.4rem);margin:0;color:var(--gold);letter-spacing:.15em;text-shadow:0 0 18px rgba(255,43,62,.6)}
.sub{color:var(--muted);margin:0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.game{display:grid;grid-template-rows:auto 1fr;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;background:var(--card);border:2px solid rgba(230,187,98,.4);transition:transform .15s,border-color .15s,box-shadow .15s}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 0 24px rgba(255,43,62,.45);outline:none}
.art{height:150px;display:grid;place-items:center;font-size:3.2rem;gap:6px}
.art.sicbo{background:radial-gradient(ellipse at 50% 90%,#33bdb4,#0f4b48 45%,#170a0c 46%)}
.art.poker{background:radial-gradient(ellipse at 50% 40%,#1d7354,var(--felt) 70%)}
.dice{display:flex;gap:10px}
.die{width:40px;height:40px;border-radius:7px;background:radial-gradient(circle at 30% 25%,#ff5a63,#c8141f 60%,#8c0812);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.die span{width:7px;height:7px;border-radius:50%;background:#fff;place-self:center}
.cards{display:flex;gap:8px}
.pc{width:44px;height:62px;border-radius:6px;background:#fbf8f1;color:#151515;display:grid;place-items:center;font:800 1.1rem/1 Georgia,serif;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.pc.r{color:#c8423b}
.info{padding:16px 18px;display:grid;gap:6px;align-content:start}
.info h2{font-family:var(--display);margin:0;font-size:1.4rem;color:var(--gold)}
.info p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.tag{justify-self:start;font-size:.75rem;border:1px solid var(--line,rgba(230,187,98,.4));border-radius:99px;padding:2px 10px;color:var(--ivory)}
.go{margin-top:6px;justify-self:start;background:var(--neon);color:#fff;border-radius:8px;padding:8px 18px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
.art.mj{background:radial-gradient(ellipse at 50% 40%,#1f7a58,#0d3a2a 75%)}
.mjt{width:38px;height:52px;border-radius:6px;background:linear-gradient(#fffdf6,#e9dfc2);border-bottom:4px solid #b6a273;display:grid;place-items:center;font:900 1.3rem/1 "Noto Serif TC",serif;box-shadow:0 4px 8px rgba(0,0,0,.5)}
</style></head><body>
<div class="wrap">
  <header><h1>鑫河大廳</h1><p class="sub">選一款遊戲入座</p></header>
  <section class="games">
    <a class="game" href="/sicbo">
      <div class="art sicbo"><div class="dice">
        <div class="die"><i></i><i></i><i></i><i></i><span></span><i></i><i></i><i></i><i></i></div>
        <div class="die"><span></span><i></i><span></span><span></span><i></i><span></span><span></span><i></i><span></span></div>
        <div class="die"><span></span><i></i><span></span><i></i><i></i><i></i><span></span><i></i><span></span></div>
      </div></div>
      <div class="info"><h2>鑫河骰寶</h2><span class="tag">多人連線 · 需登入</span><p>每 30 秒一局，大小單雙、點數、圍骰任你押，同桌玩家即時同步。</p><span class="go">進入遊戲</span></div>
    </a>
    <a class="game" href="/poker">
      <div class="art poker"><div class="cards"><div class="pc">A♠</div><div class="pc r">K♥</div><div class="pc r">Q♦</div></div></div>
      <div class="info"><h2>德州撲克</h2><span class="tag">單機 · 可與電腦對戰</span><p>4～9 人一桌，真人與電腦玩家混合，多位真人可共用同一台裝置輪流看牌。</p><span class="go">進入遊戲</span></div>
    </a>
    <a class="game" href="/mahjong">
      <div class="art mj"><div class="cards"><div class="mjt" style="color:#c62828">中</div><div class="mjt" style="color:#2e7d32">發</div><div class="mjt" style="color:#1565c0">白</div></div></div>
      <div class="info"><h2>鑫河麻將</h2><span class="tag">台灣十六張 · 對戰電腦</span><p>你和 3 位電腦同桌，吃碰槓胡、補花算台，自摸門清都有台。</p><span class="go">進入遊戲</span></div>
    </a>
  </section>
  <footer>虛擬籌碼，僅供娛樂，不可兌換。</footer>
</div>
</body></html>
